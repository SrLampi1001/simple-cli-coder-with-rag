[project]
name = "simple-cli-coder-with-rag"
version = "0.1.0"
description = "Simple CLI code assistant with RAG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0,<2",
    "fastembed>=0.8.1,<0.9",
    "loguru>=0.7",
    "openai>=1.0,<2",
    "platformdirs>=4.0",
    "prompt-toolkit>=3.0.53",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "pypdf>=5.0,<6",
    "sqlite-vec>=0.1.9",
]

[project.optional-dependencies]
remote-embedder = ["httpx", "tenacity"]

[project.scripts]
coder = "simple_cli_coder_with_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simple_cli_coder_with_rag"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "mypy",
    "ruff",
    "import-linter",
    "pre-commit",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Scope ruff to actual Python source. `agent-development/` (the implementation
# plan) and `docs/` (project documentation) contain illustrative Python inside
# Markdown that ruff 0.16+ would otherwise reformat, silently rewriting the
# DO-01..DO-10 planning documents. Excluding them keeps the gate focused on
# `src/` and `tests/`.
extend-exclude = ["agent-development/", "docs/"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true

# Per-module overrides. ignore_missing_imports is a boolean (not a list).
# anthropic ships types, so it is NOT overridden.
[[tool.mypy.overrides]]
module = "fastembed"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sqlite_vec"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pypdf"
ignore_missing_imports = true

# Strict mode applies only to our own code.
[[tool.mypy.overrides]]
module = "simple_cli_coder_with_rag.*"
disallow_untyped_defs = true

[tool.importlinter]
root_package = "simple_cli_coder_with_rag"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "layered-architecture"
type = "layers"
layers = [
    "simple_cli_coder_with_rag.presentation",
    "simple_cli_coder_with_rag.infrastructure",
    "simple_cli_coder_with_rag.application",
    "simple_cli_coder_with_rag.domain",
]

# Regression guard (DO-06): ``fastembed`` is a heavy dependency that
# pins an ONNX runtime. It must only appear in
# ``infrastructure/embedders/fastembed_embedder.py``. No upper-layer
# module (``application``, ``domain``, ``presentation``) may import it
# directly. Indirect imports through the embedder are tolerated because
# the composition root in ``cli.py`` legitimately constructs a
# ``FastembedEmbedder`` — the chain
# ``cli.py -> infrastructure.embedders.fastembed_embedder -> fastembed``
# is the only path that may reach it.
[[tool.importlinter.contracts]]
name = "fastembed-only-in-embedders"
type = "forbidden"
source_modules = [
    "simple_cli_coder_with_rag.application",
    "simple_cli_coder_with_rag.domain",
    "simple_cli_coder_with_rag.presentation",
]
forbidden_modules = ["fastembed"]
allow_indirect_imports = true

# Regression guard (DO-11): ``openai`` must only appear in
# ``infrastructure/llm/openai_client.py``. Upper layers reach it through
# the ``LLMClient`` Protocol / ``build_llm_client`` (composition root).
[[tool.importlinter.contracts]]
name = "openai-only-in-openai-client"
type = "forbidden"
source_modules = [
    "simple_cli_coder_with_rag.application",
    "simple_cli_coder_with_rag.domain",
    "simple_cli_coder_with_rag.presentation",
]
forbidden_modules = ["openai"]
allow_indirect_imports = true

# Regression guard (DO-11): ``anthropic`` must only appear in
# ``infrastructure/llm/anthropic_client.py``. Upper layers reach it through
# the ``LLMClient`` Protocol / ``build_llm_client`` (composition root).
[[tool.importlinter.contracts]]
name = "anthropic-only-in-anthropic-client"
type = "forbidden"
source_modules = [
    "simple_cli_coder_with_rag.application",
    "simple_cli_coder_with_rag.domain",
    "simple_cli_coder_with_rag.presentation",
]
forbidden_modules = ["anthropic"]
allow_indirect_imports = true

# Regression guard (DO-11): the domain layer must not know about the
# infrastructure providers subpackage (application/presentation may, for
# the /connect, /providers, /provider commands).
[[tool.importlinter.contracts]]
name = "domain-no-providers"
type = "forbidden"
source_modules = ["simple_cli_coder_with_rag.domain"]
forbidden_modules = ["simple_cli_coder_with_rag.infrastructure.providers"]
allow_indirect_imports = false

# Regression guard (DO-07): ``sqlite_vec`` is the Python helper package
# that registers the ``vec0`` extension. It must only appear in
# ``infrastructure/vector_stores/sqlite_vec_store.py``. Upper-layer
# modules must reach it through the ``VectorStore`` Protocol, never by
# importing the package directly. Indirect imports through the store
# itself are tolerated (composition root builds a ``SqliteVecStore`` —
# the chain ``cli.py -> infrastructure.vector_stores.sqlite_vec_store
# -> sqlite_vec`` is the only path that may reach it).
[[tool.importlinter.contracts]]
name = "sqlite-vec-only-in-vector-stores"
type = "forbidden"
source_modules = [
    "simple_cli_coder_with_rag.application",
    "simple_cli_coder_with_rag.domain",
    "simple_cli_coder_with_rag.presentation",
]
forbidden_modules = ["sqlite_vec"]
allow_indirect_imports = true

# Regression guard (DO-13): ``pypdf`` is the PDF parser used by the
# ``ExtensionDispatchLoader``. It must only appear in
# ``infrastructure/document_loaders/extension_dispatch.py``. Upper-layer
# modules reach the loader through the ``DocumentLoader`` Protocol,
# never by importing ``pypdf`` directly. Indirect imports through the
# loader are tolerated (composition root constructs the loader in
# the ``/learn <path>`` path).
[[tool.importlinter.contracts]]
name = "pypdf-only-in-document-loaders"
type = "forbidden"
source_modules = [
    "simple_cli_coder_with_rag.application",
    "simple_cli_coder_with_rag.domain",
    "simple_cli_coder_with_rag.presentation",
]
forbidden_modules = ["pypdf"]
allow_indirect_imports = true

# Regression guard (DO-13): the domain layer must not know about the
# document loaders package (mirrors the existing
# ``domain-no-providers`` rule). The ``DocumentLoader`` Protocol and
# ``DocumentMetadata`` model live in ``domain``; the concrete loader
# lives in ``infrastructure/document_loaders/`` and is reached only
# from the application / presentation layers.
[[tool.importlinter.contracts]]
name = "domain-no-document-loaders"
type = "forbidden"
source_modules = ["simple_cli_coder_with_rag.domain"]
forbidden_modules = ["simple_cli_coder_with_rag.infrastructure.document_loaders"]
allow_indirect_imports = false